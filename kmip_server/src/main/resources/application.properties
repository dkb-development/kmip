# SSL Configuration
server.ssl.enabled=true
server.ssl.key-store-type=JKS
server.ssl.key-store=classpath:kmip_server_keystore.jks
server.ssl.key-store-password=changeit
server.ssl.key-alias=kmipserver
server.ssl.key-password=changeit

# KMIP Server Port (if needed, though SSL usually uses the same port)
# server.port=8080

# KMIP TCP Server Configuration
kmip.server.tcp.port=5696
kmip.server.tcp.bind-address=0.0.0.0
kmip.server.tcp.max-connections=100
kmip.server.tcp.socket-timeout-ms=30000
kmip.server.tcp.connection-timeout-ms=10000
kmip.server.tcp.max-message-size-bytes=1048576
kmip.server.tcp.buffer-size-bytes=8192
kmip.server.tcp.keep-alive=true
kmip.server.tcp.tcp-no-delay=true

# Thread Pool Configuration
kmip.server.tcp.thread-pool.core-pool-size=10
kmip.server.tcp.thread-pool.maximum-pool-size=50
kmip.server.tcp.thread-pool.keep-alive-time-seconds=60
kmip.server.tcp.thread-pool.queue-capacity=1000

# SSL Configuration for KMIP TCP Server
kmip.server.tcp.ssl.enabled=true
kmip.server.tcp.ssl.require-client-auth=false
kmip.server.tcp.ssl.key-store-path=classpath:kmip_server_keystore.jks
kmip.server.tcp.ssl.key-store-password=changeit
kmip.server.tcp.ssl.key-store-type=JKS
kmip.server.tcp.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Logging Configuration
kmip.server.tcp.logging.log-connections=true
kmip.server.tcp.logging.log-messages=false
kmip.server.tcp.logging.log-message-details=false
kmip.server.tcp.logging.max-logged-message-size=1000

# Logging level (optional)
logging.level.com.kmip.server=DEBUG