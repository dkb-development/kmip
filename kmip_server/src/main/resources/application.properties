# SSL Configuration
server.ssl.enabled=true
server.ssl.key-store-type=JKS
server.ssl.key-store=classpath:kmip_server_keystore.jks
server.ssl.key-store-password=changeit
server.ssl.key-alias=kmipserver
server.ssl.key-password=changeit

# KMIP Server Port (if needed, though SSL usually uses the same port)
# server.port=8080

# KMIP TCP Server Port
kmip.server.port=5697

# Logging level (optional)
logging.level.com.kmip.server=DEBUG